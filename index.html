<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Percorso GeoJSON con GPS e Fascicolo Linea PDF</title>
  
  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <!-- PDF.js Libreria Mozilla per lettura PDF client-side -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /* Box Info GPS Chilometrica */
    #display-km {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.95);
      border: 2px solid #0066cc;
      border-radius: 8px;
      padding: 10px 16px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 18px;
      color: #333333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .accuracy-info {
      font-size: 12px;
      color: #666666;
      font-weight: normal;
    }

    /* Box Fascicolo Linea PDF */
    #fascicolo-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.95);
      border: 2px solid #28a745;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: Arial, sans-serif;
      color: #222;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fl-title {
      font-size: 13px;
      font-weight: bold;
      color: #28a745;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .fl-section {
      font-size: 12px;
      color: #555;
      font-style: italic;
    }

    .fl-row {
      font-size: 14px;
      font-weight: bold;
      color: #000;
    }

    .fl-next {
      font-size: 13px;
      color: #444;
    }

    /* Pulsanti di controllo */
    .controls-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gps-btn {
      background-color: #ffffff;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }
    .gps-btn.active {
      background-color: #0078FF;
      color: white;
    }

    .user-dot-marker {
      width: 16px;
      height: 16px;
      background-color: #FF0055;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
    }

    .custom-km-popup .maplibregl-popup-content {
      background-color: #0066cc;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 15px;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      text-align: center;
    }
    .custom-km-popup .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #0066cc; }
    .custom-km-popup .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: #0066cc; }
    .custom-km-popup .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: #0066cc; }
    .custom-km-popup .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: #0066cc; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Box Fascicolo Linea PDF -->
  <div id="fascicolo-box">
    <div class="fl-title">📖 Fascicolo Linea (PDF)</div>
    <div id="fl-header" class="fl-section">Caricamento PDF in corso...</div>
    <div id="fl-current" class="fl-row">In attesa del segnale GPS...</div>
    <div id="fl-next" class="fl-next">Prossimo elemento: --</div>
  </div>

  <!-- Box GPS Chilometrica -->
  <div id="display-km">
    <div id="km-text">Km --.---</div>
    <div id="accuracy-text" class="accuracy-info">Accuratezza GPS: -- m</div>
  </div>
  
  <div class="controls-container">
    <button id="lock-btn" class="gps-btn active">🧭 Mappa Orientata: ON</button>
    <button id="recenter-btn" class="gps-btn">🎯 Centra Posizione</button>
  </div>
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <script>
    let geojsonList = [];
    let pdfDoc = null;
    let parsedPdfData = []; // Struttura in memoria estratta direttamente dal PDF

    // Mappatura delle linee GeoJSON alle pagine del PDF
    const linePageMapping = {
      'r16': [1, 2, 3, 4, 5, 6, 7, 8],     // Pagine per Milano Cadorna - Saronno (Diretta e Locale)
      'r17': [9, 10, 11, 12, 13, 14],     // Pagine per Saronno - Varese / Laveno
      'r27': [45, 46, 47, 48]             // Pagine per Seveso - Asso
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [9.20, 45.66],
      zoom: 12,
      pitch: 45
    });

    let followMode = true;
    let lastBearing = 0;
    let userMarkerElement = document.createElement('div');
    userMarkerElement.className = 'user-dot-marker';
    
    let userMarker = new maplibregl.Marker({ element: userMarkerElement }).setLngLat([9.20, 45.66]).addTo(map);

    let lastCoords = null;
    let currentClickPopup = null;
    let popupTimer = null;

    // --- CARICAMENTO E PARSING PDF CON PDF.JS ---
    pdfjsLib.getDocument('fl_fnm.pdf').promise.then(async function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('fl-header').innerText = "PDF caricato. Analisi linee in corso...";
      console.log("PDF caricato con successo. Pagine totali:", pdfDoc.numPages);
      await extractAllPDFData();
      document.getElementById('fl-header').innerText = "Fascicolo Linea Sincronizzato";
    }).catch(err => {
      console.error("Errore caricamento PDF:", err);
      document.getElementById('fl-header').innerText = "Errore caricamento fl_fnm.pdf";
    });

    // Estrazione dati da tutte le pagine del PDF
    async function extractAllPDFData() {
      parsedPdfData = [];
      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        const textContent = await page.getTextContent();

        let pageTitle = "";
        let pageRows = [];

        // Raggruppamento del testo per coordinata Y (righe di tabella)
        let rowsByY = {};

        textContent.items.forEach(item => {
          let str = item.str.trim();
          if (!str) return;

          let y = Math.round(item.transform[5]);
          if (!rowsByY[y]) rowsByY[y] = [];
          rowsByY[y].push({ x: item.transform[4], text: str });
        });

        // Ordinamento righe dall'alto verso il basso
        let sortedY = Object.keys(rowsByY).sort((a, b) => b - a);

        sortedY.forEach(y => {
          let items = rowsByY[y].sort((a, b) => a.x - b.x);
          let fullRowText = items.map(i => i.text).join(" ");

          if (fullRowText.includes("Fiancata principale") || fullRowText.includes("tronco")) {
            pageTitle = fullRowText;
          }

          // Cerca elementi con chilometrica (formato es. 0,000 o 21,157)
          items.forEach(item => {
            let match = item.text.match(/^(\d{1,3},\d{3})$/);
            if (match) {
              let kmVal = parseFloat(match[1].replace(',', '.'));
              pageRows.push({
                km: kmVal,
                fullRowText: fullRowText,
                page: pageNum
              });
            }
          });
        });

        if (pageRows.length > 0) {
          parsedPdfData.push({
            page: pageNum,
            title: pageTitle || `Pagina ${pageNum}`,
            rows: pageRows.sort((a, b) => a.km - b.km)
          });
        }
      }
    }

    // --- AGGIORNAMENTO FASCICOLO LINEA IN BASE ALLA PROGRESSIVA KM REALE ---
    function updateFascicoloUi(currentKm, activeLineKey) {
      if (parsedPdfData.length === 0) return;

      let allowedPages = linePageMapping[activeLineKey] || [];
      let candidateRows = [];

      parsedPdfData.forEach(p => {
        if (allowedPages.length === 0 || allowedPages.includes(p.page)) {
          p.rows.forEach(r => {
            candidateRows.push({ ...r, pageTitle: p.title });
          });
        }
      });

      if (candidateRows.length === 0) return;

      candidateRows.sort((a, b) => a.km - b.km);

      let prevElement = candidateRows[0];
      let nextElement = candidateRows[candidateRows.length - 1];

      for (let i = 0; i < candidateRows.length - 1; i++) {
        if (currentKm >= candidateRows[i].km && currentKm <= candidateRows[i+1].km) {
          prevElement = candidateRows[i];
          nextElement = candidateRows[i+1];
          break;
        }
      }

      document.getElementById('fl-header').innerText = prevElement.pageTitle || `Pagina PDF: ${prevElement.page}`;
      document.getElementById('fl-current').innerText = `📍 Km ${prevElement.km.toFixed(3)} - ${prevElement.fullRowText}`;
      document.getElementById('fl-next').innerText = `➡️ Succ: Km ${nextElement.km.toFixed(3)} - ${nextElement.fullRowText}`;
    }

    map.on('load', () => {
      Promise.all([
        fetch('geojson/r16.geojson').then(res => { if (!res.ok) throw new Error('r16.geojson non trovato'); return res.json(); }),
        fetch('geojson/r17.geojson').then(res => { if (!res.ok) throw new Error('r17.geojson non trovato'); return res.json(); }),
        fetch('geojson/r27.geojson').then(res => { if (!res.ok) throw new Error('r27.geojson non trovato'); return res.json(); })
      ])
      .then(([data16, data17, data27]) => {
        geojsonList = [
          { key: 'r16', data: data16 },
          { key: 'r17', data: data17 },
          { key: 'r27', data: data27 }
        ];

        let allFeatures = [];
        [data16, data17, data27].forEach(data => {
          if (data.type === 'FeatureCollection') {
            allFeatures.push(...data.features);
          } else if (data.type === 'Feature') {
            allFeatures.push(data);
          }
        });

        const visualCollection = {
          type: 'FeatureCollection',
          features: allFeatures
        };

        map.addSource('route', {
          'type': 'geojson',
          'data': visualCollection
        });

        map.addLayer({
          'id': 'route-line',
          'type': 'line',
          'source': 'route',
          'layout': {
            'line-join': 'round',
            'line-cap': 'round'
          },
          'paint': {
            'line-color': '#0066cc',
            'line-width': 5,
            'line-opacity': 0.8
          }
        });

        const bbox = turf.bbox(visualCollection);
        map.fitBounds(bbox, { padding: 40 });
      })
      .catch(error => {
        console.error('Errore durante il recupero dei file GeoJSON:', error);
      });

      map.addSource('gps-accuracy', {
        'type': 'geojson',
        'data': { 'type': 'FeatureCollection', 'features': [] }
      });

      map.addLayer({
        'id': 'gps-accuracy-fill',
        'type': 'fill',
        'source': 'gps-accuracy',
        'paint': { 'fill-color': '#0078FF', 'fill-opacity': 0.15 }
      });

      map.addLayer({
        'id': 'gps-accuracy-outline',
        'type': 'line',
        'source': 'gps-accuracy',
        'paint': { 'line-color': '#0078FF', 'line-width': 1, 'line-opacity': 0.4 }
      });
    });

    function getProgressivaKm(userLat, userLon, list) {
      if (!list || list.length === 0) return { km: '--.---', snappedCoords: [userLon, userLat], lineKey: 'r16' };
      
      const userPt = turf.point([userLon, userLat]);
      let closestResult = null;
      let minDistance = Infinity;

      list.forEach(item => {
        try {
          const flattened = turf.flatten(item.data);
          
          flattened.features.forEach(feat => {
            const snapped = turf.nearestPointOnLine(feat, userPt);
            const distFromUser = snapped.properties.dist;

            if (distFromUser < minDistance) {
              minDistance = distFromUser;
              closestResult = {
                km: snapped.properties.location !== undefined ? snapped.properties.location.toFixed(3) : '--.---',
                kmNum: snapped.properties.location !== undefined ? snapped.properties.location : 0,
                snappedCoords: snapped.geometry.coordinates,
                lineKey: item.key
              };
            }
          });
        } catch (err) {
          console.warn("Errore elaborazione tracciato:", err);
        }
      });

      return closestResult || { km: '--.---', kmNum: 0, snappedCoords: [userLon, userLat], lineKey: 'r16' };
    }

    map.on('click', 'route-line', (e) => {
      if (geojsonList.length === 0) return;

      const clickLat = e.lngLat.lat;
      const clickLon = e.lngLat.lng;

      const result = getProgressivaKm(clickLat, clickLon, geojsonList);

      if (popupTimer) clearTimeout(popupTimer);
      if (currentClickPopup) currentClickPopup.remove();

      currentClickPopup = new maplibregl.Popup({
        className: 'custom-km-popup',
        closeButton: false,
        closeOnClick: false,
        offset: 10
      })
        .setLngLat(result.snappedCoords)
        .setHTML(`Km ${result.km}`)
        .addTo(map);

      popupTimer = setTimeout(() => {
        if (currentClickPopup) {
          currentClickPopup.remove();
          currentClickPopup = null;
        }
      }, 5000);
    });

    map.on('mouseenter', 'route-line', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'route-line', () => { map.getCanvas().style.cursor = ''; });

    function onLocationFound(e) {
      const lat = e.coords.latitude;
      const lon = e.coords.longitude;
      const heading = e.coords.heading;
      const accuracy = e.coords.accuracy;

      userMarker.setLngLat([lon, lat]);

      if (geojsonList.length > 0) {
        const resultGps = getProgressivaKm(lat, lon, geojsonList);
        document.getElementById('km-text').innerText = `Km ${resultGps.km}`;
        
        // Sincronizzazione automatica con il Fascicolo Linea PDF
        if (resultGps.kmNum > 0) {
          updateFascicoloUi(resultGps.kmNum, resultGps.lineKey);
        }
      }
      
      if (accuracy !== undefined && accuracy !== null) {
        document.getElementById('accuracy-text').innerText = `Accuratezza GPS: ±${Math.round(accuracy)} m`;
        const circleFeature = turf.buffer(turf.point([lon, lat]), accuracy, { units: 'meters' });
        if (map.getSource('gps-accuracy')) {
          map.getSource('gps-accuracy').setData(circleFeature);
        }
      }

      if (heading !== null && !isNaN(heading)) {
        lastBearing = heading;
      } else if (lastCoords) {
        const dist = turf.distance(
          turf.point([lastCoords.lon, lastCoords.lat]),
          turf.point([lon, lat]),
          { units: 'meters' }
        );
        if (dist > 2) {
          lastBearing = turf.bearing(
            turf.point([lastCoords.lon, lastCoords.lat]),
            turf.point([lon, lat])
          );
        }
      }

      if (followMode) {
        map.easeTo({
          center: [lon, lat],
          bearing: lastBearing,
          duration: 1000
        });
      }

      lastCoords = { lat, lon };
    }

    function onLocationError(e) {
      if (followMode && lastCoords) {
        map.easeTo({
          center: [lastCoords.lon, lastCoords.lat],
          bearing: lastBearing,
          duration: 1000
        });
      }
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(onLocationFound, onLocationError, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      });
    }

    const lockBtn = document.getElementById('lock-btn');
    lockBtn.addEventListener('click', () => {
      followMode = !followMode;
      if (followMode) {
        lockBtn.classList.add('active');
        lockBtn.innerText = '🧭 Mappa Orientata: ON';
        if (lastCoords) {
          map.easeTo({
            center: [lastCoords.lon, lastCoords.lat],
            bearing: lastBearing,
            duration: 1000
          });
        }
      } else {
        lockBtn.classList.remove('active');
        lockBtn.innerText = '🧭 Mappa Orientata: OFF';
      }
    });

    const recenterBtn = document.getElementById('recenter-btn');
    recenterBtn.addEventListener('click', () => {
      if (lastCoords) {
        map.flyTo({
          center: [lastCoords.lon, lastCoords.lat],
          bearing: lastBearing,
          zoom: 15,
          essential: true
        });
      }
    });
  </script>

</body>
</html>
