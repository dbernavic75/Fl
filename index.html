<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Monitor Linea Milano Cadorna - Asso</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #121212; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        .header { background: #1e1e1e; padding: 10px; text-align: center; font-weight: bold; font-size: 14px; border-bottom: 2px solid #333; color: #00ff66; }
        
        .map-container { flex: 1; background: #1a1a1a; display: flex; justify-content: center; align-items: center; padding: 10px; position: relative; overflow: hidden; }
        svg { width: 100%; height: 100%; max-height: 65vh; }
        
        .panel { background: #000; padding: 12px; border-top: 2px solid #333; text-align: center; }
        
        .km-box { background: #181818; border: 2px solid #00ff66; border-radius: 8px; padding: 6px; margin-bottom: 6px; }
        .km-val { font-size: 30px; font-weight: bold; color: #00ff66; font-family: monospace; letter-spacing: 1px; }
        .km-label { font-size: 10px; color: #888; text-transform: uppercase; margin-top: 2px; }
        
        .ente-val { font-size: 14px; color: #ffcc00; margin-bottom: 4px; font-weight: bold; }
        .status-val { font-size: 11px; color: #aaa; margin-bottom: 8px; font-style: italic; min-height: 16px; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn-gps { flex: 2; background: #008000; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-gps.active { background: #cc0000; }
        .btn-test { flex: 1; background: #444; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        #user-dot { transition: cx 0.2s linear, cy 0.2s linear; }
    </style>
</head>
<body>

    <div class="header">LINEA FERROVIARIA MILANO CADORNA ➔ CANZO-ASSO</div>

    <div class="map-container">
        <svg id="svg-map" viewBox="0 0 300 900" preserveAspectRatio="xMidYMid meet">
            <!-- Tracciato Geometria Binari -->
            <polyline id="track-line" points="
                150,870 148,840 145,810 142,780 140,750 138,720 137,690 136,660 
                135,630 135,600 136,570 138,540 140,510 142,480 145,450 148,420 
                152,390 158,360 165,330 175,300 188,270 202,240 218,210 232,180 
                242,150 250,120 255,90 258,60 260,30" 
                fill="none" stroke="#ff3333" stroke-width="3.5" stroke-linecap="round" />

            <!-- Principali Capisaldi e Stazioni -->
            <circle cx="150" cy="870" r="6" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="162" y="874" fill="#fff" font-size="10">Mi Cadorna (0.0)</text>

            <circle cx="145" cy="810" r="5" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="157" y="814" fill="#fff" font-size="10">Mi Bovisa (4.1)</text>

            <circle cx="138" cy="720" r="5" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="150" y="724" fill="#fff" font-size="10">Paderno D. (12.2)</text>

            <circle cx="135" cy="630" r="5" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="147" y="634" fill="#fff" font-size="10">Seregno (22.2)</text>

            <circle cx="140" cy="510" r="5" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="152" y="514" fill="#fff" font-size="10">Mariano C. (29.2)</text>

            <circle cx="152" cy="390" r="5" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="164" y="394" fill="#fff" font-size="10">Inverigo (34.0)</text>

            <circle cx="188" cy="270" r="5" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="200" y="274" fill="#fff" font-size="10">Merone (39.3)</text>

            <circle cx="232" cy="180" r="5" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="175" y="184" fill="#fff" font-size="10">Erba (43.3)</text>

            <circle cx="258" cy="60" r="5" fill="#00ff00" stroke="#fff" stroke-width="1.5" />
            <text x="205" y="64" fill="#fff" font-size="10">Canzo (49.6)</text>

            <circle cx="260" cy="30" r="7" fill="#00ff00" stroke="#fff" stroke-width="2" />
            <text x="210" y="34" fill="#fff" font-size="11" font-weight="bold">ASSO (50.4)</text>

            <!-- Cursore Posizione Treno -->
            <circle id="user-dot" cx="-50" cy="-50" r="8" fill="#00ffff" stroke="#ffffff" stroke-width="2" />
        </svg>
    </div>

    <div class="panel">
        <div class="km-box">
            <div id="km-display" class="km-val">Km --.---</div>
            <div class="km-label">Progressiva Chilometrica Reale</div>
        </div>
        <div id="ente-display" class="ente-val">GPS Inattivo</div>
        <div id="status-display" class="status-val">Pronto per il tracciamento</div>
        
        <div class="btn-group">
            <button id="gps-btn" class="btn-gps" onclick="toggleGPS()">📍 ATTIVA GPS</button>
            <button class="btn-test" onclick="simulaAvanzamento()">🧪 SIMULAZIONE</button>
        </div>
    </div>

    <script>
        // Capisaldi di linea con curve reali e coordinate geografiche esatte (M. Cadorna -> Asso)
        const tratte = [
            { km: 0.000, ente: "MILANO CADORNA", lat: 45.46820, lon: 9.17640, svgX: 150, svgY: 870 },
            { km: 1.710, ente: "Milano Domodossola", lat: 45.48150, lon: 9.16230, svgX: 148, svgY: 840 },
            { km: 4.140, ente: "MILANO BOVISA", lat: 45.50160, lon: 9.15580, svgX: 145, svgY: 810 },
            { km: 6.200, ente: "Milano Affori", lat: 45.52110, lon: 9.16850, svgX: 142, svgY: 780 },
            { km: 8.500, ente: "Cormano-Cusano", lat: 45.54120, lon: 9.16910, svgX: 140, svgY: 750 },
            { km: 12.200, ente: "Paderno Dugnano", lat: 45.57180, lon: 9.16380, svgX: 138, svgY: 720 },
            { km: 14.100, ente: "Palazzolo Milanese", lat: 45.58850, lon: 9.16010, svgX: 137, svgY: 690 },
            { km: 16.000, ente: "Varedo", lat: 45.60120, lon: 9.15800, svgX: 136, svgY: 660 },
            { km: 18.200, ente: "Bovisio Masciago", lat: 45.61890, lon: 9.15600, svgX: 135, svgY: 630 },
            { km: 20.100, ente: "Cesano Maderno", lat: 45.63180, lon: 9.15000, svgX: 135, svgY: 600 },
            { km: 22.200, ente: "Seveso", lat: 45.64410, lon: 9.13880, svgX: 136, svgY: 570 },
            { km: 24.500, ente: "Meda", lat: 45.66010, lon: 9.15500, svgX: 138, svgY: 540 },
            { km: 26.800, ente: "Cabiate", lat: 45.67400, lon: 9.17100, svgX: 140, svgY: 510 },
            { km: 29.200, ente: "Mariano Comense", lat: 45.69120, lon: 9.18100, svgX: 142, svgY: 480 },
            { km: 31.049, ente: "AROSIO", lat: 45.70761, lon: 9.18932, svgX: 145, svgY: 450 },
            { km: 34.011, ente: "INVERIGO", lat: 45.72960, lon: 9.21160, svgX: 152, svgY: 390 },
            { km: 36.905, ente: "Lambrugo-Lurago", lat: 45.75050, lon: 9.23050, svgX: 165, svgY: 330 },
            { km: 39.336, ente: "MERONE", lat: 45.77000, lon: 9.23900, svgX: 188, svgY: 270 },
            { km: 43.332, ente: "ERBA", lat: 45.80200, lon: 9.25500, svgX: 232, svgY: 180 },
            { km: 45.188, ente: "Ponte Lambro", lat: 45.81700, lon: 9.26500, svgX: 242, svgY: 150 },
            { km: 46.112, ente: "Caslino d'Erba", lat: 45.82500, lon: 9.26800, svgX: 250, svgY: 120 },
            { km: 49.679, ente: "Canzo", lat: 45.85461, lon: 9.26930, svgX: 258, svgY: 60 },
            { km: 50.412, ente: "CANZO-ASSO", lat: 45.86012, lon: 9.26781, svgX: 260, svgY: 30 }
        ];

        let watchId = null;
        let simInterval = null;

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateRealtimePosition(lat, lon, accuracy) {
            document.getElementById('status-display').innerText = `Accuratezza GPS: ±${Math.round(accuracy)}m`;

            let segMin = 0;
            let distMin = Infinity;

            // Proiezione ortogonale sul micro-segmento più vicino
            for (let i = 0; i < tratte.length - 1; i++) {
                const d1 = getDistanceMeters(lat, lon, tratte[i].lat, tratte[i].lon);
                const d2 = getDistanceMeters(lat, lon, tratte[i+1].lat, tratte[i+1].lon);
                const segLen = getDistanceMeters(tratte[i].lat, tratte[i].lon, tratte[i+1].lat, tratte[i+1].lon);

                const deviazione = (d1 + d2) - segLen;
                if (deviazione < distMin) {
                    distMin = deviazione;
                    segMin = i;
                }
            }

            const pA = tratte[segMin];
            const pB = tratte[segMin + 1];

            const distA = getDistanceMeters(lat, lon, pA.lat, pA.lon);
            const distAB = getDistanceMeters(pA.lat, pA.lon, pB.lat, pB.lon);

            let ratio = distA / distAB;
            if (ratio < 0) ratio = 0;
            if (ratio > 1) ratio = 1;

            const kmCalcolato = pA.km + (ratio * (pB.km - pA.km));
            
            document.getElementById('km-display').innerText = `Km ${kmCalcolato.toFixed(3)}`;
            document.getElementById('ente-display').innerText = `${pA.ente} ➔ ${pB.ente}`;

            const currentSvgX = pA.svgX + ratio * (pB.svgX - pA.svgX);
            const currentSvgY = pA.svgY + ratio * (pB.svgY - pA.svgY);

            const userDot = document.getElementById('user-dot');
            userDot.setAttribute('cx', currentSvgX);
            userDot.setAttribute('cy', currentSvgY);
        }

        function toggleGPS() {
            const btn = document.getElementById('gps-btn');
            const status = document.getElementById('status-display');

            if (simInterval) clearInterval(simInterval);

            if (watchId === null) {
                if (!("geolocation" in navigator)) {
                    alert("Geolocalizzazione non supportata.");
                    return;
                }

                status.innerText = "Acquisizione satelliti in corso...";
                btn.innerText = "🛑 ARRESTA GPS";
                btn.classList.add('active');

                watchId = navigator.geolocation.watchPosition(
                    pos => {
                        updateRealtimePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                    },
                    err => {
                        status.innerText = "Segnale GPS debole o assente.";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );

            } else {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                btn.innerText = "📍 ATTIVA GPS";
                btn.classList.remove('active');
                status.innerText = "Tracciamento Arrestato";
                
                document.getElementById('user-dot').setAttribute('cx', -50);
            }
        }

        function simulaAvanzamento() {
            if (watchId) toggleGPS();
            if (simInterval) clearInterval(simInterval);

            let index = 0;
            let ratio = 0;
            const status = document.getElementById('status-display');
            status.innerText = "Simulazione Corsa Milano Cadorna ➔ Asso";

            simInterval = setInterval(() => {
                ratio += 0.2;
                if (ratio > 1) {
                    ratio = 0;
                    index++;
                    if (index >= tratte.length - 1) index = 0;
                }

                const pA = tratte[index];
                const pB = tratte[index + 1];

                const lat = pA.lat + ratio * (pB.lat - pA.lat);
                const lon = pA.lon + ratio * (pB.lon - pA.lon);

                updateRealtimePosition(lat, lon, 2);
            }, 400);
        }
    </script>
</body>
</html>
