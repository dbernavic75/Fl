<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa GeoJSON & Fascicolo Linea PDF HD</title>
  
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    #display-km {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.95);
      border: 2px solid #0066cc;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: bold;
      font-size: 18px;
      color: #333333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .accuracy-info {
      font-size: 12px;
      color: #666666;
      font-weight: normal;
    }

    /* Finestra PDF in Alta Definizione */
    #pdf-viewer-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 12;
      width: 400px;
      max-height: 500px;
      background: #ffffff;
      border: 2px solid #0066cc;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #pdf-header {
      background-color: #0066cc;
      color: #ffffff;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #pdf-canvas-wrapper {
      position: relative;
      width: 100%;
      height: 420px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #f0f0f0;
    }

    #pdf-canvas {
      display: block;
      margin: 0 auto;
      width: 100%; /* Il CSS adatta la larghezza, la risoluzione interna è gestita via script in HD */
    }

    #pdf-train-marker {
      position: absolute;
      left: 0;
      right: 0;
      height: 30px;
      background-color: rgba(255, 0, 85, 0.25);
      border-top: 2px solid #ff0055;
      border-bottom: 2px solid #ff0055;
      pointer-events: none;
      transition: top 0.3s ease-in-out;
      display: none;
      z-index: 5;
    }

    #pdf-train-marker::before {
      content: "🚂 POSIZIONE TRENO";
      position: absolute;
      right: 8px;
      top: 4px;
      font-size: 10px;
      font-weight: bold;
      color: #b3003b;
      background: rgba(255, 255, 255, 0.9);
      padding: 2px 5px;
      border-radius: 3px;
    }

    .controls-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gps-btn {
      background-color: #ffffff;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 1px 5px rgba(0,0,0,0.4);
    }
    .gps-btn.active {
      background-color: #0078FF;
      color: white;
    }

    .user-dot-marker {
      width: 16px;
      height: 16px;
      background-color: #FF0055;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="pdf-viewer-container">
    <div id="pdf-header">
      <span id="pdf-title-text">📄 Fascicolo Linea PDF (HD)</span>
      <span id="pdf-page-num" style="font-size: 11px;">Pag. --</span>
    </div>
    <div id="pdf-canvas-wrapper">
      <div id="pdf-train-marker"></div>
      <canvas id="pdf-canvas"></canvas>
    </div>
  </div>

  <div id="display-km">
    <div id="km-text">Km --.---</div>
    <div id="accuracy-text" class="accuracy-info">Accuratezza GPS: -- m</div>
  </div>
  
  <div class="controls-container">
    <button id="lock-btn" class="gps-btn active">🧭 Mappa Orientata: ON</button>
    <button id="recenter-btn" class="gps-btn">🎯 Centra Posizione</button>
  </div>
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <script>
    let geojsonList = [];
    let pdfDoc = null;
    let pageTextData = []; 
    let currentRenderedPage = null;
    let isRendering = false;
    let lastKmValue = null;
    let trainDirection = 'increasing'; // 'increasing' o 'decreasing'

    // Mappatura avanzata pagine PDF in base alla linea e al verso
    // r16: Milano Cadorna - Saronno
    const linePageMapping = {
      'r16': {
        increasing: [1, 2, 5, 6], // Pagine di andata (Cadorna -> Saronno)[cite: 1, 2, 5, 6]
        decreasing: [3, 4, 7, 8]  // Pagine di ritorno (Saronno -> Cadorna)[cite: 3, 4, 7, 8]
      },
      'r17': {
        increasing: [9, 10, 11],
        decreasing: [12, 13, 14]
      },
      'r27': {
        increasing: [45, 46],
        decreasing: [47, 48]
      }
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [9.20, 45.66],
      zoom: 12,
      pitch: 45
    });

    let followMode = true;
    let lastBearing = 0;
    let userMarkerElement = document.createElement('div');
    userMarkerElement.className = 'user-dot-marker';
    
    let userMarker = new maplibregl.Marker({ element: userMarkerElement }).setLngLat([9.20, 45.66]).addTo(map);

    let lastCoords = null;
    let currentClickPopup = null;
    let popupTimer = null;

    pdfjsLib.getDocument('fl_fnm.pdf').promise.then(async function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('pdf-title-text').innerText = "Fascicolo Linea (Pronto)";
      await parsePDFStructure();
    }).catch(err => {
      console.error("Errore apertura PDF:", err);
    });

    async function parsePDFStructure() {
      pageTextData = [];
      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        const textContent = await page.getTextContent();
        const viewport = page.getViewport({ scale: 1.0 });

        let kmEntries = [];

        textContent.items.forEach(item => {
          let str = item.str.trim();
          let match = str.match(/^(\d{1,3},\d{3})$/);
          if (match) {
            let kmVal = parseFloat(match[1].replace(',', '.'));
            let originalY = item.transform[5];
            let normalizedY = viewport.height - originalY;

            kmEntries.push({
              km: kmVal,
              y: normalizedY,
              viewportHeight: viewport.height
            });
          }
        });

        if (kmEntries.length > 0) {
          pageTextData.push({
            pageNum: pageNum,
            entries: kmEntries.sort((a, b) => a.km - b.km)
          });
        }
      }
    }

    // Rendering HD con Device Pixel Ratio per eliminare la sgranatura
    async function renderPdfPageAndFocus(pageNum, targetKm) {
      if (!pdfDoc || isRendering) return;

      const pageData = pageTextData.find(p => p.pageNum === pageNum);
      if (!pageData) return;

      if (currentRenderedPage !== pageNum) {
        isRendering = true;
        currentRenderedPage = pageNum;
        document.getElementById('pdf-page-num').innerText = `Pag. ${pageNum}`;

        const page = await pdfDoc.getPage(pageNum);
        const containerWidth = document.getElementById('pdf-canvas-wrapper').clientWidth;
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        
        // Risoluzione HD moltiplicata per la densità dello schermo del dispositivo
        const outputScale = window.devicePixelRatio || 2;
        const scale = (containerWidth / unscaledViewport.width) * outputScale;
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.getElementById('pdf-canvas');
        const context = canvas.getContext('2d');
        
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        // Salviamo la scala logica per posizionare correttamente il marcatore
        canvas.dataset.logicalScale = (containerWidth / unscaledViewport.width);
        isRendering = false;
      }

      const canvas = document.getElementById('pdf-canvas');
      const logicalScale = parseFloat(canvas.dataset.logicalScale) || 1.0;
      
      let entries = pageData.entries;
      let matchedEntry = entries[0];

      for (let i = 0; i < entries.length - 1; i++) {
        if (targetKm >= entries[i].km && targetKm <= entries[i+1].km) {
          let ratio = (targetKm - entries[i].km) / (entries[i+1].km - entries[i].km);
          let interpolatedY = entries[i].y + ratio * (entries[i+1].y - entries[i].y);
          matchedEntry = { y: interpolatedY };
          break;
        } else if (targetKm > entries[entries.length - 1].km) {
          matchedEntry = entries[entries.length - 1];
        }
      }

      if (matchedEntry) {
        const marker = document.getElementById('pdf-train-marker');
        const calculatedTop = (matchedEntry.y * logicalScale) - 15;
        
        marker.style.top = `${calculatedTop}px`;
        marker.style.display = 'block';

        const wrapper = document.getElementById('pdf-canvas-wrapper');
        const scrollTarget = calculatedTop - (wrapper.clientHeight / 2) + 15;
        wrapper.scrollTo({ top: Math.max(0, scrollTarget), behavior: 'smooth' });
      }
    }

    function syncPdfWithKm(currentKm, lineKey) {
      if (pageTextData.length === 0) return;

      // Determina il verso di marcia in base alla variazione della chilometrica
      if (lastKmValue !== null) {
        if (currentKm > lastKmValue) trainDirection = 'increasing';
        else if (currentKm < lastKmValue) trainDirection = 'decreasing';
      }
      lastKmValue = currentKm;

      let lineConfig = linePageMapping[lineKey] || { increasing: [], decreasing: [] };
      let allowedPages = lineConfig[trainDirection] || lineConfig.increasing || [];
      
      let targetPage = null;

      // Cerca la pagina che contiene esattamente il chilometro attuale nel range corretto
      for (let p of pageTextData) {
        if (allowedPages.length === 0 || allowedPages.includes(p.pageNum)) {
          let minKm = p.entries[0].km;
          let maxKm = p.entries[p.entries.length - 1].km;
          if (currentKm >= minKm - 0.2 && currentKm <= maxKm + 0.2) {
            targetPage = p.pageNum;
            break;
          }
        }
      }

      // Fallback alla prima pagina consentita se non trova il match esatto nel range
      if (!targetPage && allowedPages.length > 0) {
        targetPage = allowedPages[0];
      }

      if (targetPage) {
        renderPdfPageAndFocus(targetPage, currentKm);
      }
    }

    map.on('load', () => {
      Promise.all([
        fetch('geojson/r16.geojson').then(res => res.json()),
        fetch('geojson/r17.geojson').then(res => res.json()),
        fetch('geojson/r27.geojson').then(res => res.json())
      ])
      .then(([data16, data17, data27]) => {
        geojsonList = [
          { key: 'r16', data: data16 },
          { key: 'r17', data: data17 },
          { key: 'r27', data: data27 }
        ];

        let allFeatures = [...data16.features, ...data17.features, ...data27.features];
        const visualCollection = { type: 'FeatureCollection', features: allFeatures };

        map.addSource('route', { type: 'geojson', data: visualCollection });
        map.addLayer({
          id: 'route-line',
          type: 'line',
          source: 'route',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#0066cc', 'line-width': 5, 'line-opacity': 0.8 }
        });

        map.fitBounds(turf.bbox(visualCollection), { padding: 40 });
      });
    });

    function getProgressivaKm(userLat, userLon, list) {
      if (!list || list.length === 0) return { km: '--.---', kmNum: 0, lineKey: 'r16' };
      const userPt = turf.point([userLon, userLat]);
      let closestResult = null;
      let minDistance = Infinity;

      list.forEach(item => {
        try {
          const flattened = turf.flatten(item.data);
          flattened.features.forEach(feat => {
            const snapped = turf.nearestPointOnLine(feat, userPt);
            if (snapped.properties.dist < minDistance) {
              minDistance = snapped.properties.dist;
              closestResult = {
                km: snapped.properties.location.toFixed(3),
                kmNum: snapped.properties.location,
                snappedCoords: snapped.geometry.coordinates,
                lineKey: item.key
              };
            }
          });
        } catch (err) {}
      });
      return closestResult || { km: '--.---', kmNum: 0, lineKey: 'r16' };
    }

    function onLocationFound(e) {
      const lat = e.coords.latitude;
      const lon = e.coords.longitude;
      userMarker.setLngLat([lon, lat]);

      if (geojsonList.length > 0) {
        const resultGps = getProgressivaKm(lat, lon, geojsonList);
        document.getElementById('km-text').innerText = `Km ${resultGps.km}`;
        
        if (resultGps.kmNum > 0) {
          syncPdfWithKm(resultGps.kmNum, resultGps.lineKey);
        }
      }

      if (followMode) {
        map.easeTo({ center: [lon, lat], duration: 1000 });
      }
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(onLocationFound, () => {}, { enableHighAccuracy: true });
    }

    document.getElementById('lock-btn').addEventListener('click', (e) => {
      followMode = !followMode;
      e.target.classList.toggle('active', followMode);
      e.target.innerText = followMode ? '🧭 Mappa Orientata: ON' : '🧭 Mappa Orientata: OFF';
    });
  </script>

</body>
</html>
