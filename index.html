<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa con Tracciato e GPS</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #controls {
      padding: 10px 15px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-gps {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-gps.active {
      background-color: #dc3545;
    }

    #gps-status {
      font-size: 13px;
      color: #6c757d;
    }

    #map {
      width: 100vw;
      height: calc(100vh - 53px);
    }

    /* Icona personalizzata Posizione Utente */
    .user-position-marker {
      background-color: #007bff;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="controls">
    <button id="btn-gps" class="btn-gps" onclick="toggleGPS()">
      <span>📍</span> <span id="btn-label">Attiva GPS</span>
    </button>
    <span id="gps-status">GPS Disattivato</span>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Inizializzazione Mappa
    const map = L.map('map').setView([45.8101, 9.2725], 13); // Coordinate di default

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2. Esempio Tracciato (Polyline)
    const trackCoordinates = [
      [45.8101, 9.2725],
      [45.8130, 9.2760],
      [45.8160, 9.2800],
      [45.8200, 9.2820]
    ];

    const polyline = L.polyline(trackCoordinates, {
      color: '#ff4757',
      weight: 5,
      opacity: 0.8
    }).addTo(map);

    // Adatta la vista al tracciato
    map.fitBounds(polyline.getBounds());

    // 3. Gestione Geolocalizzazione GPS
    let watchId = null;
    let userMarker = null;
    let userAccuracyCircle = null;
    let isFirstFix = true;

    function toggleGPS() {
      if (watchId === null) {
        startGPS();
      } else {
        stopGPS();
      }
    }

    function startGPS() {
      if (!("geolocation" in navigator)) {
        alert("La geolocalizzazione non è supportata dal browser in uso.");
        return;
      }

      const btn = document.getElementById("btn-gps");
      const label = document.getElementById("btn-label");
      const status = document.getElementById("gps-status");

      status.textContent = "Ricerca segnale...";
      label.textContent = "Disattiva GPS";
      btn.classList.add("active");

      isFirstFix = true;

      watchId = navigator.geolocation.watchPosition(
        onGpsSuccess,
        onGpsError,
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    }

    function stopGPS() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      if (userMarker) map.removeLayer(userMarker);
      if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

      userMarker = null;
      userAccuracyCircle = null;

      const btn = document.getElementById("btn-gps");
      const label = document.getElementById("btn-label");
      const status = document.getElementById("gps-status");

      label.textContent = "Attiva GPS";
      status.textContent = "GPS Disattivato";
      btn.classList.remove("active");
    }

    function onGpsSuccess(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;
      const userLatLng = [lat, lng];

      // Aggiorna o crea il cerchio di accuratezza
      if (userAccuracyCircle) {
        userAccuracyCircle.setLatLng(userLatLng).setRadius(accuracy);
      } else {
        userAccuracyCircle = L.circle(userLatLng, {
          radius: accuracy,
          color: '#007bff',
          fillColor: '#007bff',
          fillOpacity: 0.15,
          weight: 1
        }).addTo(map);
      }

      // Aggiorna o crea il marcatore utente
      if (userMarker) {
        userMarker.setLatLng(userLatLng);
      } else {
        const userIcon = L.divIcon({
          className: 'custom-user-icon',
          html: '<div class="user-position-marker"></div>',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });

        userMarker = L.marker(userLatLng, { icon: userIcon }).addTo(map);
      }

      // Al primo punto valido, centra la mappa sulla posizione attuale
      if (isFirstFix) {
        map.setView(userLatLng, 16);
        isFirstFix = false;
      }

      document.getElementById("gps-status").textContent = `Accuratezza: ±${Math.round(accuracy)}m`;
    }

    function onGpsError(error) {
      let msg = "Errore rilevamento GPS.";
      switch (error.code) {
        case error.PERMISSION_DENIED:
          msg = "Permesso GPS negato.";
          break;
        case error.POSITION_UNAVAILABLE:
          msg = "Segnale non disponibile.";
          break;
        case error.TIMEOUT:
          msg = "Richiesta GPS scaduta.";
          break;
      }
      document.getElementById("gps-status").textContent = msg;
      stopGPS();
    }
  </script>
</body>
</html>
