<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Percorso GeoJSON con GPS Orientato</title>
  
  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #display-km {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.95);
      border: 2px solid #0066cc;
      border-radius: 8px;
      padding: 10px 16px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 18px;
      color: #333333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .accuracy-info {
      font-size: 12px;
      color: #666666;
      font-weight: normal;
    }

    .controls-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gps-btn {
      background-color: #ffffff;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }
    .gps-btn.active {
      background-color: #0078FF;
      color: white;
    }

    /* Marker Cerchietto ad alto contrasto */
    .user-dot-marker {
      width: 16px;
      height: 16px;
      background-color: #FF0055;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
    }

    /* Stile personalizzato per il Popup del punto toccato */
    .custom-km-popup .maplibregl-popup-content {
      background-color: #0066cc;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 15px;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      text-align: center;
    }
    .custom-km-popup .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
      border-top-color: #0066cc;
    }
    .custom-km-popup .maplibregl-popup-anchor-top .maplibregl-popup-tip {
      border-bottom-color: #0066cc;
    }
    .custom-km-popup .maplibregl-popup-anchor-left .maplibregl-popup-tip {
      border-right-color: #0066cc;
    }
    .custom-km-popup .maplibregl-popup-anchor-right .maplibregl-popup-tip {
      border-left-color: #0066cc;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="display-km">
    <div id="km-text">Km --.---</div>
    <div id="accuracy-text" class="accuracy-info">Accuratezza GPS: -- m</div>
  </div>
  
  <div class="controls-container">
    <button id="lock-btn" class="gps-btn active">🧭 Mappa Orientata: ON</button>
    <button id="recenter-btn" class="gps-btn">🎯 Centra Posizione</button>
  </div>
  
  <!-- MapLibre GL e Turf.js -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <script>
    let geojsonData = null;

    // Inizializzazione della Mappa Vettoriale MapLibre
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [9.20, 45.66],
      zoom: 12,
      pitch: 45 // Inclinazione della vista simil-navigatore
    });

    let followMode = true;
    let lastBearing = 0; // Memorizza l'ultima direzione valida
    let userMarkerElement = document.createElement('div');
    userMarkerElement.className = 'user-dot-marker';
    
    let userMarker = new maplibregl.Marker({ element: userMarkerElement }).setLngLat([9.20, 45.66]).addTo(map);

    let lastCoords = null;
    let currentClickPopup = null;
    let popupTimer = null;

    map.on('load', () => {
      // Caricamento asincrono del file GeoJSON esterno
      fetch('geojson/r16.geojson')
        .then(response => {
          if (!response.ok) {
            throw new Error('Errore nel caricamento del file GeoJSON: ' + response.statusText);
          }
          return response.json();
        })
        .then(data => {
          geojsonData = data;

          // Caricamento del tracciato GeoJSON sulla mappa
          map.addSource('route', {
            'type': 'geojson',
            'data': geojsonData
          });

          map.addLayer({
            'id': 'route-line',
            'type': 'line',
            'source': 'route',
            'layout': {
              'line-join': 'round',
              'line-cap': 'round'
            },
            'paint': {
              'line-color': '#0066cc',
              'line-width': 5,
              'line-opacity': 0.8
            }
          });

          // Adattamento della vista iniziale al percorso caricato
          const bbox = turf.bbox(geojsonData);
          map.fitBounds(bbox, { padding: 40 });
        })
        .catch(error => {
          console.error('Si è verificato un errore durante il recupero del file GeoJSON:', error);
        });

      // Sorgente e Layer per il Cerchio di Accuratezza GPS
      map.addSource('gps-accuracy', {
        'type': 'geojson',
        'data': {
          'type': 'FeatureCollection',
          'features': []
        }
      });

      map.addLayer({
        'id': 'gps-accuracy-fill',
        'type': 'fill',
        'source': 'gps-accuracy',
        'paint': {
          'fill-color': '#0078FF',
          'fill-opacity': 0.15
        }
      });

      map.addLayer({
        'id': 'gps-accuracy-outline',
        'type': 'line',
        'source': 'gps-accuracy',
        'paint': {
          'line-color': '#0078FF',
          'line-width': 1,
          'line-opacity': 0.4
        }
      });
    });

    // Funzione Calcolo della Progressiva KM (Turf.js)
    function getProgressivaKm(userLat, userLon, data) {
      if (!data) return { km: '--.---', snappedCoords: [userLon, userLat] };
      
      const userPt = turf.point([userLon, userLat]);
      
      // Gestisce sia Feature che FeatureCollection/Geometry diretti
      let mainBranchCoords;
      if (data.type === 'FeatureCollection') {
        mainBranchCoords = data.features[0].geometry.coordinates[0] || data.features[0].geometry.coordinates;
      } else if (data.geometry.type === 'MultiLineString') {
        mainBranchCoords = data.geometry.coordinates[0];
      } else {
        mainBranchCoords = data.geometry.coordinates;
      }

      const mainLine = turf.lineString(mainBranchCoords);
      const snapped = turf.nearestPointOnLine(mainLine, userPt);
      return {
        km: snapped.properties.location.toFixed(3),
        snappedCoords: snapped.geometry.coordinates
      };
    }

    // Gestione del Tocco / Click sul Tracciato
    map.on('click', 'route-line', (e) => {
      if (!geojsonData) return;

      const clickLat = e.lngLat.lat;
      const clickLon = e.lngLat.lng;

      // Calcola la progressiva e il punto esatto proiettato sulla linea
      const result = getProgressivaKm(clickLat, clickLon, geojsonData);

      // Cancella l'eventuale timer o popup precedente attivo
      if (popupTimer) clearTimeout(popupTimer);
      if (currentClickPopup) currentClickPopup.remove();

      // Crea e mostra il nuovo Popup
      currentClickPopup = new maplibregl.Popup({
        className: 'custom-km-popup',
        closeButton: false,
        closeOnClick: false,
        offset: 10
      })
        .setLngLat(result.snappedCoords)
        .setHTML(`Km ${result.km}`)
        .addTo(map);

      // Imposta il timer per rimuovere il popup dopo 5 secondi (5000 ms)
      popupTimer = setTimeout(() => {
        if (currentClickPopup) {
          currentClickPopup.remove();
          currentClickPopup = null;
        }
      }, 5000);
    });

    // Cambia il cursore al passaggio sul tracciato
    map.on('mouseenter', 'route-line', () => {
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', 'route-line', () => {
      map.getCanvas().style.cursor = '';
    });

    // Gestione aggiornamenti Posizione e Orientamento
    function onLocationFound(e) {
      const lat = e.coords.latitude;
      const lon = e.coords.longitude;
      const heading = e.coords.heading; // Heading GPS (in gradi)
      const accuracy = e.coords.accuracy; // Precisione GPS in metri

      userMarker.setLngLat([lon, lat]);

      // Calcolo e aggiornamento visivo della progressiva e accuratezza
      if (geojsonData) {
        const resultGps = getProgressivaKm(lat, lon, geojsonData);
        document.getElementById('km-text').innerText = `Km ${resultGps.km}`;
      }
      
      if (accuracy !== undefined && accuracy !== null) {
        document.getElementById('accuracy-text').innerText = `Accuratezza GPS: ±${Math.round(accuracy)} m`;

        // Genera il poligono circolare con Turf.js per la precisione GPS
        const circleFeature = turf.buffer(turf.point([lon, lat]), accuracy, { units: 'meters' });
        
        if (map.getSource('gps-accuracy')) {
          map.getSource('gps-accuracy').setData(circleFeature);
        }
      }

      // Determinazione dell'orientamento di marcia
      if (heading !== null && !isNaN(heading)) {
        lastBearing = heading;
      } else if (lastCoords) {
        const dist = turf.distance(
          turf.point([lastCoords.lon, lastCoords.lat]),
          turf.point([lon, lat]),
          { units: 'meters' }
        );
        // Aggiorna l'orientamento solo se ci si è spostati di almeno 2 metri (evita rotazioni da fermo/rumore GPS)
        if (dist > 2) {
          lastBearing = turf.bearing(
            turf.point([lastCoords.lon, lastCoords.lat]),
            turf.point([lon, lat])
          );
        }
      }

      // Mantiene la mappa centrata sulla posizione dell'utente e orientata alla direzione di marcia
      if (followMode) {
        map.easeTo({
          center: [lon, lat],
          bearing: lastBearing, // La mappa ruota mantenendo in alto la direzione di marcia
          duration: 1000
        });
      }

      lastCoords = { lat, lon };
    }

    function onLocationError(e) {
      // Se si perde il segnale GPS e si trova in followMode, mantiene il centro e il bearing conosciuto
      if (followMode && lastCoords) {
        map.easeTo({
          center: [lastCoords.lon, lastCoords.lat],
          bearing: lastBearing,
          duration: 1000
        });
      }
    }

    // Avvio del tracciamento in tempo reale
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(onLocationFound, onLocationError, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      });
    }

    // Gestione Lock/Sblocco Mappa Orientata
    const lockBtn = document.getElementById('lock-btn');
    lockBtn.addEventListener('click', () => {
      followMode = !followMode;
      if (followMode) {
        lockBtn.classList.add('active');
        lockBtn.innerText = '🧭 Mappa Orientata: ON';
        if (lastCoords) {
          map.easeTo({
            center: [lastCoords.lon, lastCoords.lat],
            bearing: lastBearing,
            duration: 1000
          });
        }
      } else {
        lockBtn.classList.remove('active');
        lockBtn.innerText = '🧭 Mappa Orientata: OFF';
      }
    });

    // Gestione Pulsante Centra Posizione (Effettua il riposizionamento al centro)
    const recenterBtn = document.getElementById('recenter-btn');
    recenterBtn.addEventListener('click', () => {
      if (lastCoords) {
        map.flyTo({
          center: [lastCoords.lon, lastCoords.lat],
          bearing: lastBearing,
          zoom: 15,
          essential: true
        });
      }
    });
  </script>

</body>
</html>
