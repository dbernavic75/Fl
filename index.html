  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    #map {
      height: 100vh;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
    }

    /* Stile per il pulsante custom "Centra su GPS" */
    .gps-btn {
      background-color: #ffffff;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }
    .gps-btn:active {
      background-color: #f4f4f4;
    }

    /* Stile per l'icona del marker GPS */
    .user-location-marker {
      background-color: #0078FF;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
  </style>
</head>

      iconSize: [16, 16],

    });

      const latlng = [e.coords.latitude, e.coords.longitude];
      const accuracy = e.coords.accuracy;
      lastLatLng = latlng;

      if (!userMarker) {
        // Primo fix della posizione: creo il cerchio di accuratezza ed il marker
        accuracyCircle = L.circle(latlng, {
          radius: accuracy,
          color: '#0078FF',
          fillColor: '#0078FF',
          fillOpacity: 0.15,
          weight: 1
        }).addTo(map);

          .bindPopup(`<b>Sei qui</b><br>Accuratezza GPS: ±${Math.round(accuracy)} metri`);

        // Aggiorno le coordinate esistenti in tempo reale
        userMarker.setLatLng(latlng);
        accuracyCircle.setLatLng(latlng);
        accuracyCircle.setRadius(accuracy);
        userMarker.getPopup().setContent(`<b>Sei qui</b><br>Accuratezza GPS: ±${Math.round(accuracy)} metri`);
      }
    }

    function onLocationError(e) {
      alert("Impossibile rilevare la posizione GPS. Verificare di aver concesso i permessi e di aver attivato la geolocalizzazione sul dispositivo.\nErrore: " + e.message);

    if ('geolocation' in navigator) {

        maximumAge: 1000,         // Non usa posizioni in cache vecchie

      });

      };

    };
