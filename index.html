<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa GeoJSON & Fascicolo Linea PDF</title>
  
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Display Chilometrica GPS (Sempre visibile in basso a sinistra) */
    #display-km {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 30;
      background-color: rgba(255, 255, 255, 0.95);
      border: 2px solid #0066cc;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: bold;
      font-size: 18px;
      color: #333333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .accuracy-info {
      font-size: 12px;
      color: #666666;
      font-weight: normal;
    }

    /* Contenitore PDF a Schermo Intero */
    #pdf-viewer-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 25;
      background: #ffffff;
      display: none; /* Nascosto di default */
      flex-direction: column;
    }

    #pdf-header {
      background-color: #0066cc;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #pdf-canvas-wrapper {
      position: relative;
      width: 100%;
      height: calc(100vh - 50px);
      overflow-y: auto;
      overflow-x: hidden;
      background: #e0e0e0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .pdf-page-canvas {
      display: block;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      max-width: 95%;
      height: auto !important;
    }

    /* Pulsantiera di controllo in alto a destra */
    .controls-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 35;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gps-btn {
      background-color: #ffffff;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .gps-btn.active {
      background-color: #0078FF;
      color: white;
    }

    .user-dot-marker {
      width: 16px;
      height: 16px;
      background-color: #FF0055;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Finestra PDF a Schermo Intero con Tutte le Pagine Scorribili -->
  <div id="pdf-viewer-container">
    <div id="pdf-header">
      <span id="pdf-title-text">📄 Fascicolo Linea PDF (Completo)</span>
      <span id="pdf-pages-info" style="font-size: 13px;">Caricamento pagine...</span>
    </div>
    <div id="pdf-canvas-wrapper">
      <!-- Le pagine del PDF verranno generate qui dinamicamente -->
    </div>
  </div>

  <!-- Display Chilometrica GPS (Sempre attivo) -->
  <div id="display-km">
    <div id="km-text">Km --.---</div>
    <div id="accuracy-text" class="accuracy-info">Accuratezza GPS: -- m</div>
  </div>
  
  <div class="controls-container">
    <button id="toggle-view-btn" class="gps-btn">📖 Mostra Fascicolo Linea</button>
    <button id="lock-btn" class="gps-btn active">🧭 Mappa Orientata: ON</button>
    <button id="recenter-btn" class="gps-btn">🎯 Centra Posizione</button>
  </div>
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <script>
    let geojsonList = [];
    let pdfDoc = null;
    let isPdfRendered = false;
    let viewMode = 0; // 0 = Solo Mappa, 1 = PDF Schermo Intero

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [9.20, 45.66],
      zoom: 12,
      pitch: 45
    });

    let followMode = true;
    let lastBearing = 0;
    let userMarkerElement = document.createElement('div');
    userMarkerElement.className = 'user-dot-marker';
    
    let userMarker = new maplibregl.Marker({ element: userMarkerElement }).setLngLat([9.20, 45.66]).addTo(map);

    let lastCoords = null;
    let currentClickPopup = null;
    let popupTimer = null;

    // Caricamento del file PDF ed elaborazione di tutte le pagine in sequenza
    pdfjsLib.getDocument('fl_fnm.pdf').promise.then(async function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('pdf-title-text').innerText = "Fascicolo Linea Ufficiale";
      document.getElementById('pdf-pages-info').innerText = `Totale pagine: ${pdfDoc.numPages}`;
      console.log("PDF caricato. Pagine totali:", pdfDoc.numPages);
    }).catch(err => {
      console.error("Errore apertura PDF:", err);
      document.getElementById('pdf-title-text').innerText = "Errore caricamento PDF";
    });

    // Funzione per renderizzare tutte le pagine del PDF una sotto l'altra nel wrapper
    async function renderAllPdfPages() {
      if (!pdfDoc || isPdfRendered) return;
      isPdfRendered = true;

      const wrapper = document.getElementById('pdf-canvas-wrapper');
      wrapper.innerHTML = ''; // Pulisce eventuali elementi precedenti

      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        
        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page-canvas';
        wrapper.appendChild(canvas);

        const containerWidth = wrapper.clientWidth * 0.9;
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        
        // Risoluzione HD per una lettura nitida su PC e smartphone
        const renderScale = 2.5;
        const scale = (containerWidth / unscaledViewport.width) * renderScale;
        const viewport = page.getViewport({ scale: scale });

        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const context = canvas.getContext('2d');
        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;
      }
    }

    map.on('load', () => {
      Promise.all([
        fetch('geojson/r16.geojson').then(res => res.json()),
        fetch('geojson/r17.geojson').then(res => res.json()),
        fetch('geojson/r27.geojson').then(res => res.json())
      ])
      .then(([data16, data17, data27]) => {
        geojsonList = [
          { key: 'r16', data: data16 },
          { key: 'r17', data: data17 },
          { key: 'r27', data: data27 }
        ];

        let allFeatures = [...data16.features, ...data17.features, ...data27.features];
        const visualCollection = { type: 'FeatureCollection', features: allFeatures };

        map.addSource('route', { type: 'geojson', data: visualCollection });
        map.addLayer({
          id: 'route-line',
          type: 'line',
          source: 'route',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#0066cc', 'line-width': 5, 'line-opacity': 0.8 }
        });

        map.fitBounds(turf.bbox(visualCollection), { padding: 40 });
      });
    });

    function getProgressivaKm(userLat, userLon, list) {
      if (!list || list.length === 0) return { km: '--.---', kmNum: 0, lineKey: 'r16' };
      const userPt = turf.point([userLon, userLat]);
      let closestResult = null;
      let minDistance = Infinity;

      list.forEach(item => {
        try {
          const flattened = turf.flatten(item.data);
          flattened.features.forEach(feat => {
            const snapped = turf.nearestPointOnLine(feat, userPt);
            if (snapped.properties.dist < minDistance) {
              minDistance = snapped.properties.dist;
              closestResult = {
                km: snapped.properties.location.toFixed(3),
                kmNum: snapped.properties.location,
                snappedCoords: snapped.geometry.coordinates,
                lineKey: item.key
              };
            }
          });
        } catch (err) {}
      });
      return closestResult || { km: '--.---', kmNum: 0, lineKey: 'r16' };
    }

    // Il GPS continua a tracciare la progressiva reale in movimento in background
    function onLocationFound(e) {
      const lat = e.coords.latitude;
      const lon = e.coords.longitude;
      userMarker.setLngLat([lon, lat]);
      lastCoords = { lat, lon };

      if (geojsonList.length > 0) {
        const resultGps = getProgressivaKm(lat, lon, geojsonList);
        document.getElementById('km-text').innerText = `Km ${resultGps.km}`;
      }

      if (followMode && viewMode === 0) {
        map.easeTo({ center: [lon, lat], duration: 1000 });
      }
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(onLocationFound, () => {}, { enableHighAccuracy: true });
    }

    // Gestione del pulsante di passaggio tra Mappa e Fascicolo Linea PDF
    const toggleViewBtn = document.getElementById('toggle-view-btn');
    const pdfContainer = document.getElementById('pdf-viewer-container');
    const lockBtn = document.getElementById('lock-btn');
    const recenterBtn = document.getElementById('recenter-btn');

    toggleViewBtn.addEventListener('click', () => {
      viewMode = viewMode === 0 ? 1 : 0;

      if (viewMode === 0) {
        // Modalità Mappa: mostra tutti i pulsanti e nasconde il PDF
        pdfContainer.style.display = 'none';
        lockBtn.style.display = 'block';
        recenterBtn.style.display = 'block';
        toggleViewBtn.innerText = '📖 Mostra Fascicolo Linea';
      } else {
        // Modalità Fascicolo Linea: mostra schermo intero PDF e nasconde gli altri pulsanti
        pdfContainer.style.display = 'flex';
        lockBtn.style.display = 'none';
        recenterBtn.style.display = 'none';
        toggleViewBtn.innerText = '🗺️ Mostra Mappa';
        
        // Avvia il rendering completo di tutte le pagine se non è già stato fatto
        renderAllPdfPages();
      }
    });

    lockBtn.addEventListener('click', (e) => {
      followMode = !followMode;
      e.target.classList.toggle('active', followMode);
      e.target.innerText = followMode ? '🧭 Mappa Orientata: ON' : '🧭 Mappa Orientata: OFF';
    });

    recenterBtn.addEventListener('click', () => {
      if (lastCoords) {
        map.flyTo({ center: [lastCoords.lon, lastCoords.lat], zoom: 15, essential: true });
      }
    });
  </script>

</body>
</html>
