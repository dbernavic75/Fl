<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa GeoJSON & Fascicolo Linea PDF HD</title>
  
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      transition: opacity 0.3s ease;
    }

    /* Display Chilometrica GPS (Sempre visibile in basso a sinistra) */
    #display-km {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 20;
      background-color: rgba(255, 255, 255, 0.95);
      border: 2px solid #0066cc;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: bold;
      font-size: 18px;
      color: #333333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .accuracy-info {
      font-size: 12px;
      color: #666666;
      font-weight: normal;
    }

    /* Contenitore PDF a Schermo Intero */
    #pdf-viewer-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 15;
      background: #ffffff;
      display: none; /* Nascosto di default (Stato 1: Mappa) */
      flex-direction: column;
      transition: background-color 0.3s ease, opacity 0.3s ease;
    }

    #pdf-header {
      background-color: #0066cc;
      color: #ffffff;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #detected-line-info {
      font-size: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
    }

    #pdf-canvas-wrapper {
      position: relative;
      width: 100%;
      height: calc(100vh - 45px);
      overflow-y: auto;
      overflow-x: hidden;
      background: #f0f0f0;
    }

    #pdf-canvas {
      display: block;
      margin: 0 auto;
      width: 90% !important;
      max-width: 900px;
      height: auto !important;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    /* Pulsantiera di controllo in alto a destra */
    .controls-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gps-btn {
      background-color: #ffffff;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .gps-btn.active {
      background-color: #0078FF;
      color: white;
    }

    .user-dot-marker {
      width: 16px;
      height: 16px;
      background-color: #FF0055;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Finestra PDF a Schermo Intero -->
  <div id="pdf-viewer-container">
    <div id="pdf-header">
      <div>
        <span id="pdf-title-text">📄 Fascicolo Linea PDF (HD)</span>
        <span id="pdf-page-num" style="font-size: 12px; margin-left: 10px;">Pag. --</span>
      </div>
      <div id="detected-line-info">Linea Rilevata: in attesa...</div>
    </div>
    <div id="pdf-canvas-wrapper">
      <canvas id="pdf-canvas"></canvas>
    </div>
  </div>

  <div id="display-km">
    <div id="km-text">Km --.---</div>
    <div id="accuracy-text" class="accuracy-info">Accuratezza GPS: -- m</div>
  </div>
  
  <div class="controls-container">
    <button id="toggle-view-btn" class="gps-btn">📖 Mostra Fascicolo Linea</button>
    <button id="lock-btn" class="gps-btn active">🧭 Mappa Orientata: ON</button>
    <button id="recenter-btn" class="gps-btn">🎯 Centra Posizione</button>
  </div>
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <script>
    let geojsonList = [];
    let pdfDoc = null;
    let pageTextData = []; 
    let currentRenderedPage = null;
    let isRendering = false;
    let viewMode = 0; // 0 = Solo Mappa, 1 = PDF Schermo Intero, 2 = PDF con Mappa in Trasparenza

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [9.20, 45.66],
      zoom: 12,
      pitch: 45
    });

    let followMode = true;
    let lastBearing = 0;
    let userMarkerElement = document.createElement('div');
    userMarkerElement.className = 'user-dot-marker';
    
    let userMarker = new maplibregl.Marker({ element: userMarkerElement }).setLngLat([9.20, 45.66]).addTo(map);

    let lastCoords = null;
    let currentClickPopup = null;
    let popupTimer = null;
    let lastProcessedPage = null;

    pdfjsLib.getDocument('fl_fnm.pdf').promise.then(async function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('pdf-title-text').innerText = "Fascicolo Linea (Pronto)";
      await parsePDFStructure();
    }).catch(err => {
      console.error("Errore apertura PDF:", err);
    });

    async function parsePDFStructure() {
      pageTextData = [];
      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        const textContent = await page.getTextContent();
        const viewport = page.getViewport({ scale: 1.0 });

        let kmEntries = [];
        let pageTitle = "";

        textContent.items.forEach(item => {
          let str = item.str.trim();
          if (str.toLowerCase().includes("tronco") || str.toLowerCase().includes("tratta")) {
            pageTitle += " " + str;
          }
          let match = str.match(/^(\d{1,3},\d{3})$/);
          if (match) {
            let kmVal = parseFloat(match[1].replace(',', '.'));
            let originalY = item.transform[5];
            let normalizedY = viewport.height - originalY;

            kmEntries.push({
              km: kmVal,
              y: normalizedY,
              viewportHeight: viewport.height
            });
          }
        });

        if (kmEntries.length > 0) {
          kmEntries.sort((a, b) => a.km - b.km);
          pageTextData.push({
            pageNum: pageNum,
            title: pageTitle.trim() || `Pagina ${pageNum}`,
            minKm: kmEntries[0].km,
            maxKm: kmEntries[kmEntries.length - 1].km,
            entries: kmEntries
          });
        }
      }
    }

    // Rendering HD della pagina PDF senza scorrimento automatico forzato
    async function renderPdfPage(pageNum) {
      if (!pdfDoc || isRendering) return;

      const pageData = pageTextData.find(p => p.pageNum === pageNum);
      if (!pageData) return;

      if (currentRenderedPage !== pageNum) {
        isRendering = true;
        currentRenderedPage = pageNum;
        document.getElementById('pdf-page-num').innerText = `Pag. ${pageNum}`;

        const page = await pdfDoc.getPage(pageNum);
        const containerWidth = document.getElementById('pdf-canvas-wrapper').clientWidth;
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        
        const renderScale = 2.5; 
        const viewport = page.getViewport({ scale: renderScale });

        const canvas = document.getElementById('pdf-canvas');
        const context = canvas.getContext('2d');
        
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        isRendering = false;
      }
    }

    // Selezione della pagina corretta in base alla linea e progressiva (aggiorna i dati senza forzare il focus visivo)
    function checkPdfPage(currentKm, lineKey) {
      if (pageTextData.length === 0) return;

      document.getElementById('detected-line-info').innerText = `Linea: ${lineKey.toUpperCase()} | Km: ${currentKm.toFixed(3)}`;

      let bestPage = null;
      for (let p of pageTextData) {
        if (currentKm >= p.minKm - 0.5 && currentKm <= p.maxKm + 0.5) {
          bestPage = p;
          break;
        }
      }

      if (bestPage && lastProcessedPage !== bestPage.pageNum) {
        lastProcessedPage = bestPage.pageNum;
        renderPdfPage(bestPage.pageNum);
      }
    }

    map.on('load', () => {
      Promise.all([
        fetch('geojson/r16.geojson').then(res => res.json()),
        fetch('geojson/r17.geojson').then(res => res.json()),
        fetch('geojson/r27.geojson').then(res => res.json())
      ])
      .then(([data16, data17, data27]) => {
        geojsonList = [
          { key: 'r16', data: data16 },
          { key: 'r17', data: data17 },
          { key: 'r27', data: data27 }
        ];

        let allFeatures = [...data16.features, ...data17.features, ...data27.features];
        const visualCollection = { type: 'FeatureCollection', features: allFeatures };

        map.addSource('route', { type: 'geojson', data: visualCollection });
        map.addLayer({
          id: 'route-line',
          type: 'line',
          source: 'route',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#0066cc', 'line-width': 5, 'line-opacity': 0.8 }
        });

        map.fitBounds(turf.bbox(visualCollection), { padding: 40 });
      });
    });

    function getProgressivaKm(userLat, userLon, list) {
      if (!list || list.length === 0) return { km: '--.---', kmNum: 0, lineKey: 'r16' };
      const userPt = turf.point([userLon, userLat]);
      let closestResult = null;
      let minDistance = Infinity;

      list.forEach(item => {
        try {
          const flattened = turf.flatten(item.data);
          flattened.features.forEach(feat => {
            const snapped = turf.nearestPointOnLine(feat, userPt);
            if (snapped.properties.dist < minDistance) {
              minDistance = snapped.properties.dist;
              closestResult = {
                km: snapped.properties.location.toFixed(3),
                kmNum: snapped.properties.location,
                snappedCoords: snapped.geometry.coordinates,
                lineKey: item.key
              };
            }
          });
        } catch (err) {}
      });
      return closestResult || { km: '--.---', kmNum: 0, lineKey: 'r16' };
    }

    function onLocationFound(e) {
      const lat = e.coords.latitude;
      const lon = e.coords.longitude;
      userMarker.setLngLat([lon, lat]);

      if (geojsonList.length > 0) {
        const resultGps = getProgressivaKm(lat, lon, geojsonList);
        document.getElementById('km-text').innerText = `Km ${resultGps.km}`;
        
        if (resultGps.kmNum > 0) {
          checkPdfPage(resultGps.kmNum, resultGps.lineKey);
        }
      }

      if (followMode) {
        map.easeTo({ center: [lon, lat], duration: 1000 });
      }
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(onLocationFound, () => {}, { enableHighAccuracy: true });
    }

    // Gestione del pulsante a tre stati per la visualizzazione
    const toggleViewBtn = document.getElementById('toggle-view-btn');
    const pdfContainer = document.getElementById('pdf-viewer-container');
    const mapElement = document.getElementById('map');

    toggleViewBtn.addEventListener('click', () => {
      viewMode = (viewMode + 1) % 3;

      if (viewMode === 0) {
        // Stato 0: Solo Mappa
        pdfContainer.style.display = 'none';
        mapElement.style.opacity = '1';
        toggleViewBtn.innerText = '📖 Mostra Fascicolo Linea';
        toggleViewBtn.classList.remove('active');
      } else if (viewMode === 1) {
        // Stato 1: Fascicolo Linea a Schermo Intero (Mappa Nascosta)
        pdfContainer.style.display = 'flex';
        pdfContainer.style.backgroundColor = '#ffffff';
        mapElement.style.opacity = '1';
        toggleViewBtn.innerText = '🗺️ Fascicolo + Mappa (Trasp.)';
        toggleViewBtn.classList.add('active');
      } else if (viewMode === 2) {
        // Stato 2: Fascicolo Linea in Primo Piano con Mappa in Sottofondo Trasparente
        pdfContainer.style.display = 'flex';
        pdfContainer.style.backgroundColor = 'rgba(255, 255, 255, 0.85)'; // Sfondo semi-trasparente
        mapElement.style.opacity = '0.3'; // Mappa visibile in trasparenza
        toggleViewBtn.innerText = '🗺️ Solo Mappa';
        toggleViewBtn.classList.remove('active');
      }
    });

    document.getElementById('lock-btn').addEventListener('click', (e) => {
      followMode = !followMode;
      e.target.classList.toggle('active', followMode);
      e.target.innerText = followMode ? '🧭 Mappa Orientata: ON' : '🧭 Mappa Orientata: OFF';
    });

    document.getElementById('recenter-btn').addEventListener('click', () => {
      if (lastCoords) {
        map.flyTo({ center: [lastCoords.lon, lastCoords.lat], zoom: 15, essential: true });
      }
    });
  </script>

</body>
</html>
