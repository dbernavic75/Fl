<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Monitor Ferrovienord - Precisione GeoJSON OSM</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #121212; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        .header { background: #1e1e1e; padding: 10px; text-align: center; border-bottom: 2px solid #333; }
        .header select { background: #2a2a2a; color: #00ff66; border: 1px solid #444; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 13px; margin-top: 4px; }
        
        .map-container { flex: 1; background: #1a1a1a; display: flex; justify-content: center; align-items: center; padding: 10px; position: relative; overflow: hidden; }
        svg { width: 100%; height: 100%; max-height: 60vh; }
        
        .panel { background: #000; padding: 12px; border-top: 2px solid #333; text-align: center; }
        
        .km-box { background: #181818; border: 2px solid #00ff66; border-radius: 8px; padding: 6px; margin-bottom: 6px; }
        .km-val { font-size: 30px; font-weight: bold; color: #00ff66; font-family: monospace; letter-spacing: 1px; }
        .km-label { font-size: 10px; color: #888; text-transform: uppercase; margin-top: 2px; }
        
        .ente-val { font-size: 14px; color: #ffcc00; margin-bottom: 4px; font-weight: bold; }
        .status-val { font-size: 11px; color: #aaa; margin-bottom: 8px; font-style: italic; min-height: 16px; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn-gps { flex: 2; background: #008000; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-gps.active { background: #cc0000; }
        .btn-test { flex: 1; background: #444; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        #user-dot { transition: cx 0.15s linear, cy 0.15s linear; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; font-size: 13px; color: #aaa;">MONITOR GEOMETRICO REALE (OSM DATA)</div>
        <select id="line-selector" onchange="switchLine()">
            <option value="ALL">📍 Rilevamento Automatico (Tutte)</option>
            <option value="ASSO">Direttrice Milano ➔ Canzo-Asso</option>
            <option value="SARONNO">Direttrice Milano ➔ Saronno</option>
        </select>
    </div>

    <div class="map-container">
        <svg id="svg-map" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid meet">
            <!-- Tracciato vettoriale caricato dinamicamente tramite JS da GeoJSON -->
            <g id="tracks-group"></g>

            <!-- Cursore Posizione Treno -->
            <circle id="user-dot" cx="-50" cy="-50" r="8" fill="#00ffff" stroke="#ffffff" stroke-width="2" />
        </svg>
    </div>

    <div class="panel">
        <div class="km-box">
            <div id="km-display" class="km-val">Km --.---</div>
            <div class="km-label" id="line-label">Progressiva Calcolata su Curve Reali OSM</div>
        </div>
        <div id="ente-display" class="ente-val">GPS Inattivo</div>
        <div id="status-display" class="status-val">Pronto per il tracciamento ad alta precisione</div>
        
        <div class="btn-group">
            <button id="gps-btn" class="btn-gps" onclick="toggleGPS()">📍 ATTIVA GPS</button>
            <button class="btn-test" onclick="simulaCurva()">🧪 TEST CURVA REALISTICA</button>
        </div>
    </div>

    <script>
        // Struttura GeoJSON campionata direttamente dalle relazioni ferroviarie OSM (OpenStreetMap)
        const geoData = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "properties": { "linea": "COMUNE", "nome": "Tratto Cadorna-Bovisa" },
                    "geometry": {
                        "type": "LineString",
                        "coordinates": [
                            [9.17640, 45.46820, 0.000],  // Mi Cadorna
                            [9.16850, 45.47400, 0.950],  // Curva Parco Sempione
                            [9.16230, 45.48150, 1.710],  // Domodossola
                            [9.15820, 45.49200, 3.000],  // Scalo Farini
                            [9.15580, 45.50160, 4.140]   // Bovisa
                        ]
                    }
                },
                {
                    "type": "Feature",
                    "properties": { "linea": "SARONNO", "nome": "Tratto Bovisa-Saronno" },
                    "geometry": {
                        "type": "LineString",
                        "coordinates": [
                            [9.15580, 45.50160, 4.140],  // Bovisa
                            [9.14500, 45.50700, 4.800],  // Baffo Ovest
                            [9.13810, 45.51230, 5.340],  // Quarto Oggiaro
                            [9.13200, 45.52950, 7.710],  // Novate
                            [9.11800, 45.54450, 9.600],  // Bollate C.
                            [9.11050, 45.55320, 11.000], // Bollate N.
                            [9.08800, 45.57100, 13.100], // Garbagnate P.G.
                            [9.07320, 45.58050, 15.010], // Garbagnate M.
                            [9.06400, 45.59210, 16.500], // Cesate
                            [9.05200, 45.60300, 17.800], // Caronno
                            [9.03850, 45.61780, 19.520], // Saronno Sud
                            [9.03020, 45.62680, 21.157]  // Saronno
                        ]
                    }
                },
                {
                    "type": "Feature",
                    "properties": { "linea": "ASSO", "nome": "Tratto Bovisa-Asso" },
                    "geometry": {
                        "type": "LineString",
                        "coordinates": [
                            [9.15580, 45.50160, 4.140],  // Bovisa
                            [9.16200, 45.51000, 5.100],  // Curva Affori
                            [9.16850, 45.52110, 6.200],  // Affori
                            [9.16910, 45.54120, 8.500],  // Cormano
                            [9.16380, 45.57180, 12.200], // Paderno
                            [9.16010, 45.58850, 14.100], // Palazzolo
                            [9.15800, 45.60120, 16.000], // Varedo
                            [9.15600, 45.61890, 18.200], // Bovisio
                            [9.15000, 45.63180, 20.100], // Cesano M.
                            [9.13880, 45.64410, 22.200], // Seveso
                            [9.15500, 45.66010, 24.500], // Meda
                            [9.17100, 45.67400, 26.800], // Cabiate
                            [9.18100, 45.69120, 29.200], // Mariano
                            [9.18932, 45.70761, 31.049], // Arosio
                            [9.21160, 45.72960, 34.011], // Inverigo
                            [9.23050, 45.75050, 36.905], // Lambrugo
                            [9.23900, 45.77000, 39.336], // Merone
                            [9.25500, 45.80200, 43.332], // Erba
                            [9.26500, 45.81700, 45.188], // Ponte L.
                            [9.26800, 45.82500, 46.112], // Caslino
                            [9.26930, 45.85461, 49.679], // Canzo
                            [9.26781, 45.86012, 50.412]  // Asso
                        ]
                    }
                }
            ]
        };

        // Proiezione geografica lat/lon su coordinate SVG 400x900
        function latLonToSVG(lat, lon) {
            const minLat = 45.46000, maxLat = 45.87000;
            const minLon = 9.02000, maxLon = 9.28000;

            const x = ((lon - minLon) / (maxLon - minLon)) * 360 + 20;
            const y = 880 - (((lat - minLat) / (maxLat - minLat)) * 860);
            return { x, y };
        }

        // Renderizza la mappa reale dinamica da GeoJSON
        function drawMap() {
            const group = document.getElementById('tracks-group');
            group.innerHTML = '';

            geoData.features.forEach(feat => {
                const coords = feat.geometry.coordinates;
                let pointsStr = "";

                coords.forEach(pt => {
                    const svgPt = latLonToSVG(pt[1], pt[0]);
                    pointsStr += `${svgPt.x},${svgPt.y} `;
                });

                const color = feat.properties.linea === "SARONNO" ? "#0088ff" : "#ff3333";
                const strokeWidth = feat.properties.linea === "COMUNE" ? "4.5" : "3";

                const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
                polyline.setAttribute("points", pointsStr.trim());
                polyline.setAttribute("fill", "none");
                polyline.setAttribute("stroke", color);
                polyline.setAttribute("stroke-width", strokeWidth);
                polyline.setAttribute("stroke-linecap", "round");
                group.appendChild(polyline);

                // Disegna capisaldi/stazioni
                coords.forEach(pt => {
                    const svgPt = latLonToSVG(pt[1], pt[0]);
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute("cx", svgPt.x);
                    circle.setAttribute("cy", svgPt.y);
                    circle.setAttribute("r", "3.5");
                    circle.setAttribute("fill", "#ffffff");
                    group.appendChild(circle);
                });
            });
        }

        let watchId = null;

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Calcola la proiezione esatta sui micro-segmenti GeoJSON
        function projectOnGeoJSON(lat, lon) {
            let bestMatch = null;
            let minDist = Infinity;

            geoData.features.forEach(feat => {
                const mode = document.getElementById('line-selector').value;
                if (mode !== "ALL" && feat.properties.linea !== "COMUNE" && feat.properties.linea !== mode) return;

                const coords = feat.geometry.coordinates;
                for (let i = 0; i < coords.length - 1; i++) {
                    const pA = coords[i];
                    const pB = coords[i+1];

                    const dA = getDistanceMeters(lat, lon, pA[1], pA[0]);
                    const dB = getDistanceMeters(lat, lon, pB[1], pB[0]);
                    const dAB = getDistanceMeters(pA[1], pA[0], pB[1], pB[0]);

                    const dev = (dA + dB) - dAB;
                    if (dev < minDist) {
                        minDist = dev;
                        let ratio = dA / dAB;
                        if (ratio < 0) ratio = 0;
                        if (ratio > 1) ratio = 1;

                        const calcKm = pA[2] + ratio * (pB[2] - pA[2]);
                        const svgA = latLonToSVG(pA[1], pA[0]);
                        const svgB = latLonToSVG(pB[1], pB[0]);

                        bestMatch = {
                            km: calcKm,
                            svgX: svgA.x + ratio * (svgB.x - svgA.x),
                            svgY: svgA.y + ratio * (svgB.y - svgA.y),
                            linea: feat.properties.nome
                        };
                    }
                }
            });

            return bestMatch;
        }

        function updatePosition(lat, lon, accuracy) {
            document.getElementById('status-display').innerText = `Accuratezza GPS: ±${Math.round(accuracy)}m (GeoJSON OSM Active)`;

            const res = projectOnGeoJSON(lat, lon);
            if (res) {
                document.getElementById('km-display').innerText = `Km ${res.km.toFixed(3)}`;
                document.getElementById('ente-display').innerText = res.linea;

                const dot = document.getElementById('user-dot');
                dot.setAttribute('cx', res.svgX);
                dot.setAttribute('cy', res.svgY);
            }
        }

        function toggleGPS() {
            const btn = document.getElementById('gps-btn');
            const status = document.getElementById('status-display');

            if (watchId === null) {
                if (!("geolocation" in navigator)) {
                    alert("Geolocalizzazione non supportata.");
                    return;
                }

                status.innerText = "Aggancio Satelliti OSM...";
                btn.innerText = "🛑 ARRESTA GPS";
                btn.classList.add('active');

                watchId = navigator.geolocation.watchPosition(
                    pos => updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
                    err => status.innerText = "Errore ricezione GPS.",
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                btn.innerText = "📍 ATTIVA GPS";
                btn.classList.remove('active');
                status.innerText = "Tracciamento Arrestato";
            }
        }

        function simulaCurva() {
            // Simulazione nel punto di curvatura accentuata di Parco Sempione / Domodossola
            const simLat = 45.47400;
            const simLon = 9.16850;
            updatePosition(simLat, simLon, 1.5);
        }

        // Inizializza Mappa all'avvio
        drawMap();
    </script>
</body>
</html>
